name: Deploy to netcup

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-netcup
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Spiegel aktualisieren und nach httpdocs auschecken
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.NETCUP_HOST }}
          username: ${{ secrets.NETCUP_USER }}
          key: ${{ secrets.NETCUP_SSH_KEY }}
          port: ${{ secrets.NETCUP_PORT || '22' }}
          script: |
            set -e
            git -C "$HOME/git/EDV-Kretzer" fetch --prune origin
            git --git-dir="$HOME/git/EDV-Kretzer" --work-tree="${{ secrets.NETCUP_PATH }}" checkout -f main
